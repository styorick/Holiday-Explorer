<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>holiday-explorer</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
  </head>
  <body>
    <div id="app"></div>

    <!--theme switcher-->
    <button id="theme-toggle">
      <img src="/light-mode.svg">
    </button>

    <h1>Holiday Explorer</h1>
    <p>Deze tool helpt u de vakantieperioden van uw bestemming te ontdekken zodat u weet wanneer het hoogseizoen of laagseizoen is</p>
    
    <div class="toolbar">
      <!-- search bar -->
      <div class="search">
        <span class="search-icon material-symbols-outlined">search</span>
        <input class="search-input" id="search-input" type="text" placeholder="Zoek een land..." />
      </div>

      <!-- filter for continents -->
      <select class="filter" id="continent-filter">
        <option value="">All continents</option>
        <option value="Europe">Europe</option>
        <option value="Americas">Americas</option>
        <option value="Asia">Asia</option>
        <option value="Africa">Africa</option>
        <option value="Oceania">Oceania</option>
      </select>

      <!-- sort button -->
      <button id="sort-button">
        <img src="/A-Z-icon.svg" alt="Sort A-Z" />
      </button>

      <!-- filter for favourites -->
      <input type="checkbox" id="favourites-filter" />
      <label for="favourites-filter">Show favourites only</label>
    </div>
  
    <!-- table for holidays -->
    <table>
      <thead>
        <tr>
          <th>Datum</th>
          <th>Naam</th>
          <th>Lokale naam</th>
          <th>Landcode</th>
          <th>Types</th>
          <th>Globaal</th>
        </tr>
      </thead>
      <tbody id="holidays-list">
      
      </tbody>
    </table>

    <!-- section for country cards -->
    <section id="countries-cards"></section>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
